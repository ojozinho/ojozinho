<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 148" width="1200" height="148" fill="none" role="img" aria-label="Números do GitHub de ojozinho">
<title>Os números, direto da API do GitHub</title>
<defs>
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <style>
    @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .carta { animation: subir .7s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) { .carta { animation: none; } }
  </style>
</defs>
<rect width="1200" height="148" fill="#0d1117"/>
  <g class="carta" style="animation-delay:0.00s">
    <rect x="212" y="12" width="176" height="92" rx="14" fill="#58a6ff" fill-opacity="0.10" stroke="#58a6ff" stroke-opacity="0.28"/>
    <text x="230" y="66" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#58a6ff">177</text>
    <text x="230" y="88" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">contribuições no ano</text>
  </g>
  <g class="carta" style="animation-delay:0.08s">
    <rect x="412" y="12" width="176" height="92" rx="14" fill="#bc8cff" fill-opacity="0.10" stroke="#bc8cff" stroke-opacity="0.28"/>
    <text x="430" y="66" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#bc8cff">170</text>
    <text x="430" y="88" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">commits</text>
  </g>
  <g class="carta" style="animation-delay:0.16s">
    <rect x="612" y="12" width="176" height="92" rx="14" fill="#e6edf3" fill-opacity="0.10" stroke="#e6edf3" stroke-opacity="0.28"/>
    <text x="630" y="66" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#e6edf3">1</text>
    <text x="630" y="88" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">repositórios</text>
  </g>
  <g class="carta" style="animation-delay:0.24s">
    <rect x="812" y="12" width="176" height="92" rx="14" fill="#3fb950" fill-opacity="0.10" stroke="#3fb950" stroke-opacity="0.28"/>
    <text x="830" y="66" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#3fb950">5</text>
    <text x="830" y="88" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8b949e">pull requests</text>
  </g>
<rect width="1200" height="148" filter="url(#g)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
