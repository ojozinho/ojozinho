<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 64" width="300" height="64" fill="none" role="img" aria-label="@jozinho">
<title>@jozinho</title>
<defs>
  <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f778ba" stop-opacity="0.20"/>
    <stop offset="1" stop-color="#f778ba" stop-opacity="0.04"/>
  </linearGradient>
  <linearGradient id="v" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#f778ba" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#f778ba" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#f778ba" stop-opacity="0"/>
  </linearGradient>
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <clipPath id="c"><rect x="1" y="1" width="298" height="62" rx="14"/></clipPath>
  <style>
    @keyframes correr { to { stroke-dashoffset: -704; } }
    @keyframes varrer { from { transform: translateX(-300px); } to { transform: translateX(300px); } }
    @keyframes respirar { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    .fio  { stroke-dasharray: 90 614; animation: correr 5.5s linear infinite; }
    .luz  { animation: varrer 5.5s linear infinite; }
    .seta { animation: respirar 2.4s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .fio, .luz, .seta { animation: none; } }
  </style>
</defs>
<rect x="1" y="1" width="298" height="62" rx="14" fill="url(#f)" stroke="#f778ba" stroke-opacity="0.32"/>
<rect x="1" y="1" width="298" height="62" rx="14" class="fio" stroke="#f778ba" stroke-width="2"/>
<g clip-path="url(#c)"><rect class="luz" x="0" y="0" width="300" height="64" fill="url(#v)"/></g>
<g transform="translate(24 21)" fill="#f778ba"><path d="M6.2 0h9.6A6.2 6.2 0 0 1 22 6.2v9.6a6.2 6.2 0 0 1-6.2 6.2H6.2A6.2 6.2 0 0 1 0 15.8V6.2A6.2 6.2 0 0 1 6.2 0Zm0 2.2A4 4 0 0 0 2.2 6.2v9.6a4 4 0 0 0 4 4h9.6a4 4 0 0 0 4-4V6.2a4 4 0 0 0-4-4H6.2Zm4.8 3.1a5.7 5.7 0 1 1 0 11.4 5.7 5.7 0 0 1 0-11.4Zm0 2.2a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Zm6-3.05a1.35 1.35 0 1 1 0 2.7 1.35 1.35 0 0 1 0-2.7Z"/></g>
<text x="62" y="29" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="10.5" letter-spacing="2.6" fill="#f778ba" opacity="0.75">INSTAGRAM</text>
<text x="62" y="47" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="14.5" font-weight="700" fill="#e6edf3">@jozinho</text>
<g class="seta" transform="translate(266 26)" stroke="#f778ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
  <path d="M0 6h11M6 1l5 5-5 5"/>
</g>
<rect width="300" height="64" rx="14" filter="url(#g)" opacity="0.05" style="mix-blend-mode:overlay"/>
