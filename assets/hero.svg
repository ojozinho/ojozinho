<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" fill="none" role="img" aria-label="JOZINHO — web designer, UI/UX, São Paulo">
<title>JOZINHO — web designer · UI/UX</title>
<defs>
  <linearGradient id="ceu" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#010409"/>
    <stop offset="0.55" stop-color="#0d1117"/>
    <stop offset="1" stop-color="#14100c"/>
  </linearGradient>

  <radialGradient id="brilho" cx="0.5" cy="0.62" r="0.72">
    <stop offset="0" stop-color="#E2571E" stop-opacity="0.26"/>
    <stop offset="0.5" stop-color="#E2571E" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#E2571E" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="tinta" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#F2A65A"/>
    <stop offset="0.32" stop-color="#FF8A3D"/>
    <stop offset="0.62" stop-color="#F3E2C7"/>
    <stop offset="1" stop-color="#F2A65A"/>
    <animate attributeName="x1" values="-1;0;-1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;1;0" dur="9s" repeatCount="indefinite"/>
  </linearGradient>

  <linearGradient id="lampejo" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset="0.45" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="0.55" stop-color="#fff" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="feixe" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F2A65A" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#F2A65A" stop-opacity="1"/>
    <stop offset="0.7" stop-color="#FF8A3D" stop-opacity="1"/>
    <stop offset="1" stop-color="#FF8A3D" stop-opacity="0"/>
  </linearGradient>

  <filter id="graos" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>

  <filter id="halo" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="9" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

