  </clipPath>

  <clipPath id="revelaLinha">
    <rect id="cortina" x="182" y="0" width="0" height="460"/>
  </clipPath>

  <style>
    @keyframes correr { from { transform: translateX(0); } to { transform: translateX(1700px); } }
    @keyframes varrer { from { transform: translateX(-420px); } to { transform: translateX(1320px); } }
    @keyframes pulsar { 0%,100% { opacity: 0.5; } 50% { opacity: 1; } }
    @keyframes piscar { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes surgir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes esticar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes digitar { from { width: 0; } to { width: 410px; } }
    @keyframes tremer { 0%,100% { opacity: 0.055; } 50% { opacity: 0.085; } }

    .barra   { animation: correr linear infinite; }
    .lampejo { animation: varrer 6s cubic-bezier(.6,0,.35,1) infinite; }
    .kicker  { animation: surgir .9s ease-out both; }
    .regua   { transform-origin: left center; animation: esticar 1.4s cubic-bezier(.2,.8,.2,1) .35s both; }
    .cursor  { animation: piscar 1.05s steps(1) infinite; }
    .ponto   { animation: pulsar 2.6s ease-in-out infinite; }
    .grao    { animation: tremer 4s ease-in-out infinite; }
    #cortina { animation: digitar 2.6s steps(36) .7s both; }

    /* Quem pede menos movimento recebe menos movimento. Nao e acessibilidade decorativa: existe
       gente que sente enjoo com coisa deslizando na tela. */
    @media (prefers-reduced-motion: reduce) {
      .barra, .lampejo, .kicker, .regua, .cursor, .ponto, .grao, #cortina { animation: none; }
      #cortina { width: 410px; }
    }
  </style>
</defs>

<rect width="1200" height="460" fill="url(#ceu)"/>
<rect width="1200" height="460" fill="url(#brilho)"/>

<!-- A luz das estacoes passando pela janela do vagao. -->
<g opacity="0.9">
  <rect class="barra" x="-180" y="0" width="90" height="460" fill="url(#feixe)" opacity="0.16" style="animation-duration:7.5s;animation-delay:-0s"/>
  <rect class="barra" x="-320" y="0" width="34" height="460" fill="url(#feixe)" opacity="0.1" style="animation-duration:9s;animation-delay:-1.1s"/>
  <rect class="barra" x="-60" y="0" width="150" height="460" fill="url(#feixe)" opacity="0.07" style="animation-duration:11s;animation-delay:-2.4s"/>
  <rect class="barra" x="-420" y="0" width="60" height="460" fill="url(#feixe)" opacity="0.13" style="animation-duration:8.2s;animation-delay:-3.7s"/>
  <rect class="barra" x="-240" y="0" width="22" height="460" fill="url(#feixe)" opacity="0.18" style="animation-duration:6.4s;animation-delay:-5s"/>
</g>

<!-- Trilhos horizontais, o piso do vagao. -->
<g stroke="#F3E2C7" stroke-opacity="0.06">
  <line x1="0" y1="294" x2="1200" y2="294"/>
  <line x1="0" y1="302" x2="1200" y2="302"/>
</g>

<g class="kicker">
  <circle class="ponto" cx="182" cy="96" r="5" fill="#7BA36A"/>
  <text x="196" y="101" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="15" letter-spacing="4.2" fill="#8B949E">WEB DESIGNER  ·  UI / UX  ·  SÃO PAULO, BR</text>
</g>

