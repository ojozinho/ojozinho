<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 152" width="1200" height="152" fill="none" role="img" aria-label="Paleta">
<title>A paleta</title>
<defs>
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <style>
    @keyframes subir { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes lustro { 0%,88%,100% { opacity: 0; } 93% { opacity: .28; } }
    .carta  { animation: subir .7s cubic-bezier(.2,.8,.2,1) both; }
    .brilho { animation: lustro 6s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) { .carta, .brilho { animation: none; } .carta { opacity: 1; } }
  </style>
</defs>
<rect width="1200" height="152" fill="#0d1117"/>
  <g class="carta" style="animation-delay:0.00s">
    <rect x="12" y="8" width="176" height="88" rx="12" fill="#E2571E"/>
    <rect class="brilho" x="12" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:0.00s"/>
    <text x="12" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#E2571E">RUST</text>
    <text x="12" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#E2571E</text>
  </g>
  <g class="carta" style="animation-delay:0.09s">
    <rect x="212" y="8" width="176" height="88" rx="12" fill="#FF8A3D"/>
    <rect class="brilho" x="212" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:0.45s"/>
    <text x="212" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#FF8A3D">EMBER</text>
    <text x="212" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#FF8A3D</text>
  </g>
  <g class="carta" style="animation-delay:0.18s">
    <rect x="412" y="8" width="176" height="88" rx="12" fill="#F2A65A"/>
    <rect class="brilho" x="412" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:0.90s"/>
    <text x="412" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#F2A65A">AMBER</text>
    <text x="412" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#F2A65A</text>
  </g>
  <g class="carta" style="animation-delay:0.27s">
    <rect x="612" y="8" width="176" height="88" rx="12" fill="#F3E2C7"/>
    <rect class="brilho" x="612" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:1.35s"/>
    <text x="612" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#F3E2C7">CREAM</text>
    <text x="612" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#F3E2C7</text>
  </g>
  <g class="carta" style="animation-delay:0.36s">
    <rect x="812" y="8" width="176" height="88" rx="12" fill="#3B82D6"/>
    <rect class="brilho" x="812" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:1.80s"/>
    <text x="812" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#3B82D6">DODGER</text>
    <text x="812" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#3B82D6</text>
  </g>
  <g class="carta" style="animation-delay:0.45s">
    <rect x="1012" y="8" width="176" height="88" rx="12" fill="#7BA36A"/>
    <rect class="brilho" x="1012" y="8" width="176" height="88" rx="12" fill="#fff" opacity="0" style="animation-delay:2.25s"/>
    <text x="1012" y="118" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="2" fill="#7BA36A">MOSS</text>
    <text x="1012" y="138" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="12" fill="#8B949E">#7BA36A</text>
  </g>
<rect width="1200" height="152" filter="url(#g)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
