<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 176" width="1200" height="176" fill="none" role="img" aria-label="Números do GitHub de ojozinho">
<title>Os números, direto da API do GitHub</title>
<defs>
  <filter id="g" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <style>
    @keyframes subir { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    .carta { animation: subir .7s cubic-bezier(.2,.8,.2,1) both; }
    @media (prefers-reduced-motion: reduce) { .carta { animation: none; } }
  </style>
</defs>
<rect width="1200" height="176" fill="#0d1117"/>
<text x="212" y="24" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" letter-spacing="3.4" fill="#8B949E">DIRETO DA API DO GITHUB. ATUALIZA SOZINHO A CADA SEIS HORAS.</text>
  <g class="carta" style="animation-delay:0.00s">
    <rect x="212" y="40" width="176" height="92" rx="14" fill="#FF8A3D" fill-opacity="0.10" stroke="#FF8A3D" stroke-opacity="0.28"/>
    <text x="230" y="94" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#FF8A3D">177</text>
    <text x="230" y="116" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8B949E">contribuições no ano</text>
  </g>
  <g class="carta" style="animation-delay:0.08s">
    <rect x="412" y="40" width="176" height="92" rx="14" fill="#F2A65A" fill-opacity="0.10" stroke="#F2A65A" stroke-opacity="0.28"/>
    <text x="430" y="94" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#F2A65A">170</text>
    <text x="430" y="116" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8B949E">commits</text>
  </g>
  <g class="carta" style="animation-delay:0.16s">
    <rect x="612" y="40" width="176" height="92" rx="14" fill="#F3E2C7" fill-opacity="0.10" stroke="#F3E2C7" stroke-opacity="0.28"/>
    <text x="630" y="94" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#F3E2C7">5</text>
    <text x="630" y="116" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8B949E">repositórios</text>
  </g>
  <g class="carta" style="animation-delay:0.24s">
    <rect x="812" y="40" width="176" height="92" rx="14" fill="#63B3F5" fill-opacity="0.10" stroke="#63B3F5" stroke-opacity="0.28"/>
    <text x="830" y="94" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#63B3F5">5</text>
    <text x="830" y="116" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="11" fill="#8B949E">pull requests</text>
  </g>
<rect width="1200" height="176" filter="url(#g)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
