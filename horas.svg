    <text x="60" y="160" text-anchor="start" font-family="ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace" font-size="24" font-weight="700" fill="#e6edf3">7</text>
    <rect x="60" y="172" width="210" height="6" rx="3" fill="#30363d" opacity="0.55"/>
