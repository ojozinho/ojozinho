name: cobrinha

# A cobra que come o grafico de contribuicoes.
#
# Ela nao pode ser gerada na hora em que alguem abre o perfil: o desenho depende do historico de
# contribuicoes, que so a API do GitHub sabe. Entao o trabalho roda aqui, de tempos em tempos,
# gera o SVG e empurra para um galho separado chamado `output`. O README aponta para o arquivo
# nesse galho.
#
# O galho e separado de proposito. Assim o historico do galho principal nao enche de commit
# automatico de imagem gerada, e dar `git log` continua servindo para alguma coisa.

on:
  schedule:
    # A cada seis horas. O grafico muda devagar, e mais frequente que isso so gastaria minuto de
    # Action para redesenhar a mesma coisa.
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Desenhar a cobra
        uses: Platane/snk@v3
        id: cobra
        with:
          github_user_name: ${{ github.repository_owner }}
          # As cores acompanham a paleta do perfil, tirada da ilustracao: o fundo e o mesmo
          # #0d1117 do GitHub no modo escuro, e os pontos vao do rust ao cream conforme o dia
          # teve mais ou menos contribuicao.
          outputs: |
            dist/cobra-escura.svg?palette=github-dark&color_snake=#E2571E&color_dots=#161b22,#5c2a10,#a13d15,#E2571E,#F2A65A

      - name: Publicar no galho output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
